---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/setup"
      - "/release-pr"
      - "/release"
      - "/prerelease"
      - "/nf-registry-release"
      - "/docs-sync"
      - "/docker-release"
      - "/export-env"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
