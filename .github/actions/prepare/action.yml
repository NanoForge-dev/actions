name: prepare
description: Installs the dependencies and builds dist/, which the local actions (./release, ./coverage-report...) run
runs:
  using: composite
  steps:
    - name: Set up Node.js, pnpm and the dependencies
      uses: ./setup
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - name: Build the action bundles (dist/)
      shell: bash
      run: pnpm build
