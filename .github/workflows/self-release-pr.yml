# This repo's own release PR. It runs the local actions (./release-pr), not @v3, so a release never
# depends on the previous one. Other repos use release-pr.yml through templates/workflows/release-pr.yml.
name: Self Release PR
run-name: Self release PR ${{ inputs.version || '(auto version)' }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (empty = from the commits, breaking → major, feat → minor, fix → patch)
        type: string
        default: ""
      dry-run:
        description: Perform a dry run?
        type: boolean
        default: false

permissions: {}

jobs:
  release-pr:
    name: Create release PR
    runs-on: ubuntu-latest
    # From main only: the release environment holds the release app key, and branch code must never get it.
    if: github.repository_owner == 'NanoForge-dev' && github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare the repository
        uses: ./.github/actions/prepare

      # A token of the NanoForge release GitHub App: the release PR is then opened by the app, so self-tests run on it
      # (a PR opened with GITHUB_TOKEN triggers no workflow).
      # Whenever the app can't give a token (no key, a permission it isn't granted, or a broken key), the job warns and
      # falls back to GITHUB_TOKEN, which can't trigger other workflows nor change workflow files.
      - name: Get a token from the NanoForge release app
        id: bot
        if: vars.NANOFORGE_RELEASE_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NANOFORGE_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.NANOFORGE_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The later commits are then authored by the app's bot account instead of github-actions[bot].
      - name: Commit as the NanoForge release app
        if: steps.bot.outputs.token != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          [[ "$SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "::error::unexpected app slug \"$SLUG\""; exit 1; }
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::unexpected bot user id \"$id\""; exit 1; }
          {
            echo "GIT_AUTHOR_NAME=${SLUG}[bot]"
            echo "GIT_AUTHOR_EMAIL=${id}+${SLUG}[bot]@users.noreply.github.com"
            echo "GIT_COMMITTER_NAME=${SLUG}[bot]"
            echo "GIT_COMMITTER_EMAIL=${id}+${SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_ENV"

      - name: Warn about the GITHUB_TOKEN fallback
        if: steps.bot.outputs.token == ''
        run: echo "::warning::No NanoForge release app token (no key, a missing permission or a broken key), so this run uses GITHUB_TOKEN"

      - name: Bump the version and open the release PR
        uses: ./release-pr
        with:
          version: ${{ inputs.version }}
          dry-run: ${{ inputs.dry-run }}
          github-token: ${{ steps.bot.outputs.token || github.token }}
