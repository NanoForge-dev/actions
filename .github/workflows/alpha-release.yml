# Reusable: publishes an alpha of a package from a feature branch. See templates/workflows/alpha-release.yml.
name: Alpha Release

on:
  workflow_call:
    inputs:
      packages:
        description: Comma-separated packages (empty = the only package of the config)
        type: string
        default: ""
      dry-run:
        description: Log what would happen without publishing
        type: boolean
        default: false
      prepare-env:
        description: Env vars for the repository's prepare action, one KEY=VALUE per line
        type: string
        default: ""
    secrets:
      NPM_PUBLISH_TOKEN:
        description: npm token (publishing)
        required: false

permissions: {}

jobs:
  alpha:
    name: Alpha release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev' && github.ref_name != github.event.repository.default_branch
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Export the prepare env
        if: inputs.prepare-env != ''
        env:
          PREPARE_ENV: ${{ inputs.prepare-env }}
        run: |
          # Static KEY=VALUE lines only: keys that change how later steps (holding tokens) run are refused.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            key="${line%%=*}"
            if [[ "$line" != *=* || ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ || "$key" =~ ^(NODE_OPTIONS|BASH_ENV|ENV|PATH|LD_.*|GITHUB_.*|RUNNER_.*|ACTIONS_.*|NODE_AUTH_TOKEN|NPM_CONFIG_.*)$ ]]; then
              echo "::error::prepare-env: refused line for key \"$key\""; exit 1
            fi
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$PREPARE_ENV"

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Release alpha
        uses: NanoForge-dev/actions/prerelease@v3
        with:
          channel: alpha
          packages: ${{ inputs.packages }}
          dry-run: ${{ inputs.dry-run }}
          npm-token: ${{ secrets.NPM_PUBLISH_TOKEN }}
