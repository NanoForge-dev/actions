# Reusable: opens the release PR of a group of .github/nanoforge.json. See templates/workflows/release-pr.yml.
name: Release PR

on:
  workflow_call:
    inputs:
      group:
        description: Release group (empty = the first group)
        type: string
        default: ""
      packages:
        description: Comma-separated packages of the group (empty = the group's mode decides)
        type: string
        default: ""
      version:
        description: Version to release (empty = from the commits, breaking → major, feat → minor, fix → patch)
        type: string
        default: ""
      dry-run:
        description: Log what would happen without pushing or opening the PR
        type: boolean
        default: false
      prepare-env:
        description: Build vars for the repository's prepare action, one KEY=VALUE per line (NODE_ENV, PUBLIC_*, NEXT_PUBLIC_*, VITE_*)
        type: string
        default: ""
    outputs:
      pull-request:
        description: URL of the release PR
        value: ${{ jobs.release-pr.outputs.pull-request }}

permissions: {}

jobs:
  release-pr:
    name: Release PR (${{ inputs.version || 'auto version' }})
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull-request: ${{ steps.release-pr.outputs.pull-request }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Export the prepare env
        uses: nanoforge-dev/actions/export-env@v3
        with:
          env: ${{ inputs.prepare-env }}

      - name: Prepare the repository
        uses: ./.github/actions/prepare

      - name: Bump the versions and open the release PR
        id: release-pr
        uses: nanoforge-dev/actions/release-pr@v3
        with:
          group: ${{ inputs.group }}
          packages: ${{ inputs.packages }}
          version: ${{ inputs.version }}
          dry-run: ${{ inputs.dry-run }}
