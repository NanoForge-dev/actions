# Reusable (and used by this repo): labels PRs from .github/labeler.yml and checks the conventional title.
name: PR Triage

on:
  workflow_call:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Label pull request
        uses: actions/labeler@v7
        with:
          repo-token: ${{ github.token }}
          sync-labels: true

  validate-title:
    name: Validate title
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          REGEX="^(revert: )?(feat|fix|docs|style|refactor|perf|test|build|ci|chore|types)(\\(.+\\))?!?: .{1,72}$"

          echo "Title: \"$TITLE\""

          if [[ ! "$TITLE" =~ $REGEX ]]; then
            echo "::error::The title must follow the conventional commits: type(scope): subject"
            exit 1
          fi
