# Reusable (and used by this repo): syncs the repository labels with .github/labels.yml.
name: Label Sync

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"

permissions: {}

jobs:
  label-sync:
    name: Label sync
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Label sync
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ github.token }}
