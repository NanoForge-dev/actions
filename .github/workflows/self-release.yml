# This repo's own release. main never holds dist/: the release commit adds it on top of the merged commit and is
# pushed to release/v<major>; the tags (<version>, v<major>) and the GitHub release point at it.
name: Self Release
run-name: "Self release check of ${{ github.sha }}"

# On a push to main (a merged PR) rather than on the PR event, so the job runs on refs/heads/main and the release
# environment, which holds the release app key and allows main only, can be used.
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  check:
    name: Check for a version change
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      # Only a commit that changes the package.json version (a merged release PR) is released.
      - name: Compare the version with the previous commit
        id: check
        shell: bash
        run: |
          version=$(jq -r .version package.json)
          previous=$(git show HEAD^1:package.json | jq -r .version)
          if [ "$version" != "$previous" ]; then echo "version=$version" >> "$GITHUB_OUTPUT"; fi
          printf '# Self release check\n\n## Result\n\n- package.json version: %s (was %s)\n\n' "$version" "$previous" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release ${{ needs.check.outputs.version }}
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.version != ''
    # Holds the release app's variable and key; allow main only (repo Settings, Environments).
    environment: release
    permissions:
      contents: write
    # GitHub keeps one pending run per group: a third release merged meanwhile cancels the second, which then needs a
    # manual re-run.
    concurrency:
      group: self-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Prepare the repository and build dist/
        uses: ./.github/actions/prepare

      # A token of the NanoForge release GitHub App (installed on this repo only): moving release/v3 and v3 across
      # workflow changes needs the workflows permission. Its key is a secret of this repo only, never of the consumers,
      # since it can move v3.
      # Whenever the app can't give a token (no key, a permission it isn't granted, or a broken key), the job warns and
      # falls back to GITHUB_TOKEN, which can't trigger other workflows nor change workflow files.
      - name: Get a token from the NanoForge release app
        id: bot
        if: vars.NANOFORGE_RELEASE_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NANOFORGE_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.NANOFORGE_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      # The later commits are then authored by the app's bot account instead of github-actions[bot].
      - name: Commit as the NanoForge release app
        if: steps.bot.outputs.token != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          [[ "$SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "::error::unexpected app slug \"$SLUG\""; exit 1; }
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::unexpected bot user id \"$id\""; exit 1; }
          {
            echo "GIT_AUTHOR_NAME=${SLUG}[bot]"
            echo "GIT_AUTHOR_EMAIL=${id}+${SLUG}[bot]@users.noreply.github.com"
            echo "GIT_COMMITTER_NAME=${SLUG}[bot]"
            echo "GIT_COMMITTER_EMAIL=${id}+${SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_ENV"

      - name: Warn about the GITHUB_TOKEN fallback
        if: steps.bot.outputs.token == ''
        run: echo "::warning::No NanoForge release app token (no key, a missing permission or a broken key), so this run uses GITHUB_TOKEN"

      # The commit takes the merged commit's dates, so a re-run builds the same commit and the tags still match.
      # A release PR always carries a plain X.Y.Z version (no pre-release on this repo). Every git lookup below
      # fails the step when it errors (shell: bash runs with pipefail): a guard never skips itself.
      - name: Commit dist/ and push it to the release branch
        shell: bash
        env:
          TOKEN: ${{ steps.bot.outputs.token || github.token }}
        run: |
          version=$(jq -r .version package.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::package.json version \"$version\" is not X.Y.Z"; exit 1; }
          branch="release/v${version%%.*}"
          date=$(git log -1 --format=%cI)
          git add --force dist
          GIT_AUTHOR_DATE="$date" GIT_COMMITTER_DATE="$date" git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --no-verify -m "chore(release): ${version} with dist"
          head=$(git rev-parse HEAD)

          # Never move the branch back (a re-run of an older release). ls-remote exits 2 when the branch is missing.
          status=0
          remote=$(git ls-remote --exit-code origin "refs/heads/$branch") || status=$?
          if [ "$status" -eq 0 ] && [ "${remote%%$'\t'*}" != "$head" ]; then
            # An identical re-run skips this: fetching HEAD itself at depth 1 would cut its history (HEAD~2).
            git fetch --quiet --depth=1 origin "refs/heads/$branch"
            current=$(git show FETCH_HEAD:package.json | jq -r .version)
            [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$branch holds version \"$current\", not X.Y.Z"; exit 1; }
            newest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)
            if [ "$newest" != "$version" ]; then
              echo "::error::$branch already holds $current, newer than $version"
              exit 1
            fi
          elif [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::could not read $branch on origin"
            exit 1
          fi

          # Nor away from a version tag already set (a rebuild that isn't byte-identical).
          tagged=$(git ls-remote origin "refs/tags/$version")
          tagged=${tagged%%$'\t'*}
          if [ -n "$tagged" ] && [ "$tagged" != "$head" ]; then
            echo "::error::tag $version is already on $tagged, not on the rebuilt commit $head"
            exit 1
          fi

          basic=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push --force origin "HEAD:refs/heads/$branch"
          printf '# Release commit\n\n## Result\n\n- %s on %s, with dist/\n\n' "$(git rev-parse --short HEAD)" "$branch" >> "$GITHUB_STEP_SUMMARY"

      # HEAD is the dist commit: the version change is found against the commit before the merge (HEAD~2).
      # A failed v3 move fails the job.
      - name: Tag the release commit, move v3 and create the GitHub release
        uses: ./release
        with:
          base: HEAD~2
          github-token: ${{ steps.bot.outputs.token || github.token }}
