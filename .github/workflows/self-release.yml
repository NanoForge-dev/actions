# This repo's own release: tags <version>, moves v<major> and creates the GitHub release with the local ./release action.
name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'releases/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Release
        uses: ./release
