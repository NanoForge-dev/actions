name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    uses: NanoForge-dev/actions/.github/workflows/release.yml@v3
    secrets: inherit

