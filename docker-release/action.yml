name: "NanoForge docker release"
description: "Builds and pushes a Docker image tagged with the released version, then sets that tag in a cloud-iac Helm values file"
inputs:
  image:
    description: "Image name without the registry, e.g. nanoforge-dev/editor"
    required: true
  version:
    description: "Released version, used as the image tag (the release action's version output)"
    required: true
  registry:
    description: "Container registry"
    default: "ghcr.io"
  dockerfile:
    description: "Dockerfile to build"
    default: "Dockerfile"
  context:
    description: "Build context"
    default: "."
  target:
    description: "Build stage to build. Empty: the last stage"
    default: ""
  build-args:
    description: "Build arguments, one KEY=VALUE per line"
    default: ""
  values-file:
    description: "Helm values file in NanoForge-dev/cloud-iac that holds the image tag. Empty: don't update cloud-iac"
    default: ""
  values-key:
    description: "Path of the tag in the values file (yq syntax)"
    default: ".image.tag"
  cloud-iac-token:
    description: "Token that can push to NanoForge-dev/cloud-iac (required with values-file)"
    default: ""
  github-token:
    description: "Token that can push to the container registry"
    default: "${{ github.token }}"
runs:
  using: composite
  steps:
    - name: Check inputs
      id: check
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        VALUES_FILE: ${{ inputs.values-file }}
        VALUES_KEY: ${{ inputs.values-key }}
        CLOUD_IAC_TOKEN: ${{ inputs.cloud-iac-token }}
      run: |
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::version \"$VERSION\" is not semver"; exit 1; }
        [[ "$VALUES_KEY" =~ ^(\.[A-Za-z0-9_-]+)+$ ]] || { echo "::error::values-key \"$VALUES_KEY\" must look like .image.tag"; exit 1; }
        if [ -n "$VALUES_FILE" ] && [ -z "$CLOUD_IAC_TOKEN" ]; then echo "::error::cloud-iac-token is required with values-file"; exit 1; fi
        echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

    - name: Log in to the container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
      with:
        images: ${{ inputs.registry }}/${{ steps.check.outputs.image }}
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.version }}

    - name: Build and push the image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}

    - name: Check out cloud-iac
      if: inputs.values-file != ''
      uses: actions/checkout@v7
      with:
        path: cloud-iac
        repository: NanoForge-dev/cloud-iac
        token: ${{ inputs.cloud-iac-token }}

    - name: Set the image tag in cloud-iac
      if: inputs.values-file != ''
      shell: bash
      working-directory: cloud-iac
      env:
        IMAGE: ${{ steps.check.outputs.image }}
        VERSION: ${{ inputs.version }}
        VALUES_FILE: ${{ inputs.values-file }}
        VALUES_KEY: ${{ inputs.values-key }}
      run: |
        yq -i "${VALUES_KEY} = strenv(VERSION)" "$VALUES_FILE"
        git add -- "$VALUES_FILE"
        if git diff --cached --quiet; then echo "Tag already set"; exit 0; fi
        git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit -m "chore(${IMAGE##*/}): release docker ${IMAGE}@${VERSION}" --no-verify
        # Other image jobs may push at the same time: rebase and retry.
        for attempt in 1 2 3 4 5; do
          git pull --rebase --quiet && git push --no-verify && exit 0
          echo "Push failed (attempt $attempt), retrying"; sleep $((attempt * 5))
        done
        exit 1
