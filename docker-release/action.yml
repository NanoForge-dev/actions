name: "NanoForge docker release"
description: "Builds and pushes a Docker image tagged with the released version, then sets that tag in a cloud-iac Helm values file"
inputs:
  image:
    description: "Image name without the registry, e.g. nanoforge-dev/editor"
    required: true
  version:
    description: "Released version, used as the image tag (the release action's version output)"
    required: true
  registry:
    description: "Container registry"
    default: "ghcr.io"
  dockerfile:
    description: "Dockerfile to build"
    default: "Dockerfile"
  context:
    description: "Build context"
    default: "."
  target:
    description: "Build stage to build. Empty: the last stage"
    default: ""
  build-args:
    description: "Build arguments, one KEY=VALUE per line"
    default: ""
  values-file:
    description: "Helm values file in NanoForge-dev/cloud-iac that holds the image tag. Empty: don't update cloud-iac"
    default: ""
  values-key:
    description: "Path of the tag in the values file (yq syntax)"
    default: ".image.tag"
  cloud-iac-token:
    description: "Token that can push to NanoForge-dev/cloud-iac (required with values-file)"
    default: ""
  github-token:
    description: "Token that can push to the container registry"
    default: "${{ github.token }}"
runs:
  using: composite
  steps:
    - name: Check inputs
      id: check
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REGISTRY: ${{ inputs.registry }}
        VERSION: ${{ inputs.version }}
        VALUES_FILE: ${{ inputs.values-file }}
        VALUES_KEY: ${{ inputs.values-key }}
        CLOUD_IAC_TOKEN: ${{ inputs.cloud-iac-token }}
      run: |
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::version \"$VERSION\" is not semver"; exit 1; }
        [[ "$VALUES_KEY" =~ ^(\.[A-Za-z0-9_-]+)+$ ]] || { echo "::error::values-key \"$VALUES_KEY\" must look like .image.tag"; exit 1; }
        if [ -n "$VALUES_FILE" ] && [ -z "$CLOUD_IAC_TOKEN" ]; then echo "::error::cloud-iac-token is required with values-file"; exit 1; fi
        # Both end up in step outputs: one line each, nothing that could add another output.
        [[ "$REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._-]+)*$ ]] || { echo "::error::registry \"$REGISTRY\" must be a host like ghcr.io (with an optional port and path)"; exit 1; }
        [[ "$IMAGE" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::image \"$IMAGE\" must look like owner/name"; exit 1; }
        echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
        # An alpha is built from a feature branch: it writes its own cache and may read the production one; any
        # other version (a release, an -rc given by hand) reads and writes only :buildcache, never alpha layers.
        ref="$REGISTRY/${IMAGE,,}"
        if [[ "$VERSION" == *-alpha.* ]]; then
          printf 'cache-to=type=registry,ref=%s:buildcache-prerelease,mode=max\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'cache-from<<EOF\ntype=registry,ref=%s:buildcache\ntype=registry,ref=%s:buildcache-prerelease\nEOF\n' "$ref" "$ref" >> "$GITHUB_OUTPUT"
        else
          printf 'cache-to=type=registry,ref=%s:buildcache,mode=max\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'cache-from=type=registry,ref=%s:buildcache\n' "$ref" >> "$GITHUB_OUTPUT"
        fi

    # The docker-container driver of buildx can export a layer cache; the default docker driver can't.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to the container registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@1ec73021df0717d8bef7700a897c064453280439 # untagged commit, kept from the v2 docker-push actions
      with:
        images: ${{ inputs.registry }}/${{ steps.check.outputs.image }}
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.version }}

    - name: Build and push the image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        # A registry cache, not type=gha: release runs start from pull_request events, whose GitHub cache scope
        # (refs/pull/N/merge) no later release can read. Alphas write :buildcache-prerelease, every other
        # version :buildcache (see the check step).
        cache-from: ${{ steps.check.outputs.cache-from }}
        cache-to: ${{ steps.check.outputs.cache-to }}

    - name: Check out cloud-iac
      if: inputs.values-file != ''
      uses: actions/checkout@v7
      with:
        path: cloud-iac
        repository: NanoForge-dev/cloud-iac
        token: ${{ inputs.cloud-iac-token }}
        persist-credentials: false

    - name: Set the image tag in cloud-iac
      id: cloud-iac
      if: inputs.values-file != ''
      shell: bash
      working-directory: cloud-iac
      env:
        IMAGE: ${{ steps.check.outputs.image }}
        VERSION: ${{ inputs.version }}
        VALUES_FILE: ${{ inputs.values-file }}
        VALUES_KEY: ${{ inputs.values-key }}
        CLOUD_IAC_TOKEN: ${{ inputs.cloud-iac-token }}
      run: |
        # The token is passed per command, never stored in .git/config.
        basic="$(printf 'x-access-token:%s' "$CLOUD_IAC_TOKEN" | base64 -w0)"
        echo "::add-mask::$basic"
        auth="AUTHORIZATION: basic $basic"
        yq -i "${VALUES_KEY} = strenv(VERSION)" "$VALUES_FILE"
        git add -- "$VALUES_FILE"
        if git diff --cached --quiet; then echo "Tag already set"; exit 0; fi
        git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit -m "chore(${IMAGE##*/}): release docker ${IMAGE}@${VERSION}" --no-verify
        # Other image jobs may push at the same time: rebase and retry.
        for attempt in 1 2 3 4 5; do
          git -c "http.https://github.com/.extraheader=$auth" pull --rebase --quiet \
            && git -c "http.https://github.com/.extraheader=$auth" push --no-verify && exit 0
          echo "Push failed (attempt $attempt), retrying"; sleep $((attempt * 5))
        done
        exit 1

    - name: Write the report
      if: always()
      shell: bash
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.build.outputs.digest }}
        BUILD: ${{ steps.build.outcome }}
        VERSION: ${{ inputs.version }}
        VALUES_FILE: ${{ inputs.values-file }}
        CLOUD_IAC: ${{ steps.cloud-iac.outcome }}
      run: |
        {
          printf '# Docker release %s\n\n## Image\n\n' "$VERSION"
          if [ -n "$TAGS" ]; then printf '%s\n' "$TAGS" | sed 's/^/- /'; else printf '_None_\n'; fi
          printf '\n- build: %s\n' "$BUILD"
          [ -n "$DIGEST" ] && printf -- '- digest: %s\n' "$DIGEST"
          printf '\n## cloud-iac\n\n'
          if [ -n "$VALUES_FILE" ]; then printf -- '- %s: %s\n\n' "$VALUES_FILE" "$CLOUD_IAC"; else printf '_None_\n\n'; fi
        } >> "$GITHUB_STEP_SUMMARY"
