name: "NanoForge registry release PR"
description: "Bumps the manifest version of every NanoForge registry package changed since its last release (conventional commits) and opens the release PR"
inputs:
  path:
    description: "Directory holding the packages (nanoforge.manifest.json files)"
    default: "packages"
  dry-run:
    description: "Log what would happen without pushing or opening the PR"
    default: "false"
  github-token:
    description: "Token that pushes the release branch and opens the PR"
    default: "${{ github.token }}"
outputs:
  pull-request:
    description: "URL of the PR (empty on a dry run or when nothing changed)"
    value: ${{ steps.run.outputs.pull-request }}
  packages:
    description: "JSON list of the {name, version} to release"
    value: ${{ steps.run.outputs.packages }}
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ github.action_path }}/../.bun-version
    - name: Bump the changed registry packages
      id: run
      shell: bash
      run: bun "$GITHUB_ACTION_PATH/../dist/nf-registry-release-pr/index.js"
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
